name: Build

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.sm-version == '1.12.x' }}
    strategy:
      matrix:
        sm-version: [ '1.10.x', '1.11.x', '1.12.x' ]

    name: "Build SM ${{ matrix.sm-version }}"
    steps:
      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV
          SMVERSION_FULL=${{ matrix.sm-version }}
          echo "SMVERSION_SHORT=${SMVERSION_FULL:0:-2}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Setup SP
        uses: rumblefrog/setup-sp@master
        with:
          version: ${{ matrix.sm-version }}

      - name: Run compiler
        run: |
          cd addons/sourcemod
          mkdir plugins
          cd scripting
          spcomp VIP_Core.sp -E -o ../plugins/VIP_Core.smx -i./include

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VIP-Core-${{ env.SMVERSION_SHORT }}-${{ env.GITHUB_SHA_SHORT }}
          path: |
            addons
            LICENSE
          retention-days: 2

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      # One zip per SM version that compiled (1.12 is allowed to fail)
      - name: Archive Assets
        run: for d in */; do zip -r "${d%/}.zip" "$d"; done

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" *.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --draft --generate-notes

// Inheritance: "extend" "group1;group2" copies the plain values (not nested sections) of the listed groups.
//   - the group's own values beat inherited ones;
//   - on a conflict the group listed later wins;
//   - an own empty value ("") removes an inherited one (for this group and the groups extending it);
//   - unknown groups and loops are logged to the SourceMod error log and skipped;
//   - groups added by modules (VIP_AddGroup) can't be extended and "extend" is not a feature name.
// Example:
//   "vip_gold"
//   {
//   	"extend"	"vip1;vip2"
//   	"hp"		"200"
//   	"speed"		""		// don't inherit speed
//   }
"VIP_GROUPS"
{
	"vip1" 	// Group name
	{
		// Options (VIP Core Modules)
	}

	"vip2"
	{
		
	}
}
